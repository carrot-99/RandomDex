<!doctype html>
<html lang="ja" data-version="202611082357">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#d93b3b">
  <title>RandomDex</title>
  <!-- ?v= は scripts/bumpVersion.mjs で更新する（古いファイルがキャッシュから混ざらないようにするため） -->
  <link rel="stylesheet" href="./css/style.css?v=202611082357">
  <script type="importmap">
    {
      "imports": {
        "./js/app.js": "./js/app.js?v=202611082357",
        "./js/roulette.js": "./js/roulette.js?v=202611082357",
        "./js/detailView.js": "./js/detailView.js?v=202611082357",
        "./js/imageSwitcher.js": "./js/imageSwitcher.js?v=202611082357",
        "./js/filter.js": "./js/filter.js?v=202611082357",
        "./js/listView.js": "./js/listView.js?v=202611082357",
        "./js/history.js": "./js/history.js?v=202611082357",
        "./js/historyView.js": "./js/historyView.js?v=202611082357"
      }
    }
  </script>
  <script type="module" src="./js/app.js?v=202611082357"></script>
</head>
<body data-view="draw">
  <header class="appHeader">
    <div class="headerLeft">
      <h1 class="appTitle">RandomDex</h1>
      <p class="targetCount" id="targetCount">読み込み中…</p>
    </div>
    <div class="headerRight">
      <a class="headerButton" id="viewSwitchButton" href="#list">一覧</a>
      <button class="headerButton filterButton" id="filterButton" type="button" disabled>
        絞り込み<span class="filterBadge" id="filterBadge" hidden></span>
      </button>
    </div>
  </header>

  <!-- 抽選画面 -->
  <main class="appMain" id="drawView" data-state="idle">
    <section class="imageArea" aria-live="polite">
      <div class="imageFrame" id="imageFrame">
        <div class="placeholder" id="placeholder" aria-hidden="true">？</div>
        <img class="resultImage" id="resultImage" alt="" draggable="false" hidden>
      </div>
      <p class="imageLabel" id="imageLabel" hidden></p>
      <div class="dots" id="imageDots" aria-hidden="true" hidden></div>
    </section>

    <section class="detailArea" id="detailArea" hidden>
      <h2 class="itemName" id="itemName"></h2>
      <p class="itemSubName" id="itemSubName"></p>
      <dl class="detailList" id="detailList"></dl>
    </section>

    <p class="errorMessage" id="errorMessage" hidden></p>
  </main>

  <!-- 一覧画面 -->
  <main class="appMain listView" id="listView" hidden>
    <div class="listTop">
      <nav class="listTabs" aria-label="一覧の切り替え">
        <a class="listTab isCurrent" href="#list" aria-current="page">一覧</a>
        <a class="listTab" href="#history">抽選履歴</a>
      </nav>
      <input class="searchInput" id="searchInput" type="search" placeholder="名前で探す" autocomplete="off" enterkeyhint="search">
    </div>
    <p class="listCount" id="listCount"></p>
    <ul class="itemList" id="itemList"></ul>
  </main>

  <!-- 抽選履歴画面 -->
  <main class="appMain listView" id="historyView" hidden>
    <div class="listTop">
      <nav class="listTabs" aria-label="一覧の切り替え">
        <a class="listTab" href="#list">一覧</a>
        <a class="listTab isCurrent" href="#history" aria-current="page">抽選履歴</a>
      </nav>
    </div>
    <div class="historyHeader">
      <p class="listCount" id="historyCount"></p>
      <button class="textButton" id="historyClearButton" type="button" hidden>履歴を消去</button>
    </div>
    <ul class="itemList" id="historyList"></ul>
  </main>

  <!-- 詳細画面（一覧・履歴から開く） -->
  <main class="appMain" id="itemView" hidden>
    <a class="backLink" id="backLink" href="#list">‹ 戻る</a>
    <section class="imageArea">
      <div class="imageFrame" id="itemImageFrame">
        <div class="placeholder" id="itemPlaceholder" aria-hidden="true">？</div>
        <img class="resultImage" id="itemImage" alt="" draggable="false" hidden>
      </div>
      <p class="imageLabel" id="itemImageLabel" hidden></p>
      <div class="dots" id="itemImageDots" aria-hidden="true" hidden></div>
    </section>

    <section class="detailArea">
      <h2 class="itemName" id="itemViewName"></h2>
      <p class="itemSubName" id="itemViewSubName"></p>
      <dl class="detailList" id="itemViewDetailList"></dl>
    </section>
  </main>

  <div class="filterSheet" id="filterSheet"></div>

  <footer class="actionBar" id="actionBar">
    <button class="mainButton" id="mainButton" type="button" disabled>START</button>
  </footer>
</body>
</html>
